name: App checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: work
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: work/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx prettier --check "src/**/*.{js,jsx,css}"
      - run: python -m pip install -r backend/requirements-dev.txt
      - run: python -m pytest backend/test_api.py -q
      - run: python -m ruff check backend
      - run: python -m ruff format --check backend
